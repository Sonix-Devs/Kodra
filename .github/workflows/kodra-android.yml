name: Kodra Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kodra/android/**"
      - ".github/workflows/kodra-android.yml"
  pull_request:
    paths:
      - "kodra/android/**"
      - ".github/workflows/kodra-android.yml"

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint + assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@8df1039502a15b94d82a8a10003077d6ff1e5d39 # v4.5.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@8f36f654eac15ef6a0d8a1ff05d40f8ff7aeb93 # v3.2.1
        # No extra licenses needed beyond default

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017c81f63a4e99c0b7dd6f6f6b3d0e3d6cefa4526d # v3.5.0
        with:
          gradle-version: "8.7"

      - name: Generate Gradle wrapper
        working-directory: kodra/android
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Assemble debug APK
        working-directory: kodra/android
        run: ./gradlew :app:assembleDebug --stacktrace --warning-mode all

      - name: Android Lint
        working-directory: kodra/android
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kodra-debug-apk
          path: kodra/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kodra-lint-report
          path: kodra/android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
