name: Kodra Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kodra/android/**"
      - ".github/workflows/kodra-android.yml"
  pull_request:
    paths:
      - "kodra/android/**"
      - ".github/workflows/kodra-android.yml"

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint + assembleDebug (no device)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@8df1039502a15b94d82a8a10003077d6ff1e5d39 # v4.5.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@9b3c6e2f4d6d0b02e8c3b8b5b2f6e3b2c7e0c0f0b0d0 # v3.2.2
        with:
          log-accepted-android-sdk-licenses: true

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@bdc99aeda9b2f48c1e07d8c3c6d5d8b3f9f3f7b1 # v4.2.2

      - name: Assemble debug APK
        working-directory: kodra/android
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew :app:assembleDebug --stacktrace --warning-mode all

      - name: Android Lint
        working-directory: kodra/android
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kodra-debug-apk
          path: kodra/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kodra-lint-report
          path: kodra/android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
