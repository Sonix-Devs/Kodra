name: Kodra Release APK

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.0)"
        required: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@8df1039502a15b94d82a8a10003077d6ff1e5d39 # v4.5.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@8f36f654eac15ef6a0d8a1ff05d40f8ff7aeb93 # v3.2.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017c81f63a4e99c0b7dd6f6f6b3d0e3d6cefa4526d # v3.5.0
        with:
          gradle-version: "8.7"

      - name: Generate Gradle wrapper
        working-directory: kodra/android
        run: gradle wrapper --gradle-version 8.7 && chmod +x gradlew

      - name: Restore keystore
        if: env.KODRA_KEYSTORE_BASE64 != ''
        env:
          KODRA_KEYSTORE_BASE64: ${{ secrets.KODRA_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.keystore
          echo "$KODRA_KEYSTORE_BASE64" | base64 -d > ~/.keystore/kodra-release.jks
          echo "keystore restored"

      - name: Assemble release APK
        working-directory: kodra/android
        env:
          KODRA_KEYSTORE: ${{ secrets.KODRA_KEYSTORE_BASE64 != '' && '~/.keystore/kodra-release.jks' || '' }}
          KODRA_KEYSTORE_PASSWORD: ${{ secrets.KODRA_KEYSTORE_PASSWORD }}
          KODRA_KEY_ALIAS: ${{ secrets.KODRA_KEY_ALIAS }}
          KODRA_KEY_PASSWORD: ${{ secrets.KODRA_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kodra-release-apk
          path: kodra/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@4dd9fb4d2cc9e388bed03adb5b8a0fc9a5e6460a0d # v2.1.0
        with:
          files: kodra/android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
