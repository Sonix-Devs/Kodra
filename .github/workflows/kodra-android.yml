name: Kodra Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "kodra/android/**"
      - ".github/workflows/kodra-android.yml"
      - "kodra/**"
      - "build/kodra/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-build:
    name: Lint + assembleDebug
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses 2>&1 | tail -3 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -10 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Generate Gradle wrapper
        working-directory: kodra/android
        run: |
          gradle wrapper --gradle-version 8.7 2>&1 | tee /tmp/wrapper.log
          ec=${PIPESTATUS[0]}
          if [ $ec -ne 0 ]; then
            echo "## Gradle wrapper FAILED" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 /tmp/wrapper.log >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $ec
          fi
          chmod +x gradlew

      - name: Assemble debug APK
        working-directory: kodra/android
        run: ./gradlew :app:assembleDebug --stacktrace --warning-mode all

      - name: Android Lint
        working-directory: kodra/android
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kodra-debug-apk
          path: kodra/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodra-lint-report
          path: kodra/android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

      - name: Post failure to PR
        if: failure() && github.event_name == 'pull_request'
        run: |
          err=$(./gradlew :app:assembleDebug --stacktrace --warning-mode all 2>&1 | grep -E "e: |error:" | head -20 || true)
          body="**Kodra Android assembleDebug failed** on $GITHUB_SHA
          \`\`\`
          $err
          \`\`\`
          [Run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          gh pr comment ${{ github.event.pull_request.number }} --body "$body" 2>&1 || true
        env:
          GH_TOKEN: ${{ github.token }}
