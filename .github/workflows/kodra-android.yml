name: Kodra Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "kodra/**"
      - "build/kodra/**"
      - ".github/workflows/kodra-android.yml"

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint + assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: kodra/android

      - name: Set up Java 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        working-directory: kodra/android
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace --warning-mode all 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Report build errors
        if: failure()
        run: |
          log="$RUNNER_TEMP/gradle-build.log"
          test -s "$log" || exit 0
          {
            echo '### Gradle build failure'
            echo '```text'
            grep -E '^e: |error:|What went wrong' -A3 "$log" | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          { grep -E '^e: |What went wrong' -A2 "$log" || true; } | head -40 | while IFS= read -r line; do
            escaped="${line//'%'/'%25'}"
            escaped="${escaped//$'\r'/'%0D'}"
            echo "::error title=Gradle::${escaped}"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kodra-debug-apk
          path: kodra/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Android Lint
        working-directory: kodra/android
        continue-on-error: true
        run: gradle --no-daemon :app:lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kodra-lint-report
          path: kodra/android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
