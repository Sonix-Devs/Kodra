name: Kodra Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "kodra/android/**"
      - ".github/workflows/kodra-android.yml"
      - "kodra/**"
      - "build/kodra/**"

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint + assembleDebug
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses 2>&1 | tail -3 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -10 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Generate Gradle wrapper
        working-directory: kodra/android
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Assemble debug APK
        working-directory: kodra/android
        run: |
          ./gradlew :app:assembleDebug --stacktrace --warning-mode all 2>&1 | tee /tmp/assemble.log
          ec=\${PIPESTATUS[0]}
          # Always export log for artifact
          cp /tmp/assemble.log /tmp/gradle-assemble.log 2>&1 || true
          exit \$ec

      - name: Android Lint
        if: always()
        working-directory: kodra/android
        run: ./gradlew :app:lintDebug --stacktrace || true

      - name: Upload assemble log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodra-assemble-log
          path: /tmp/gradle-assemble.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kodra-debug-apk
          path: kodra/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodra-lint-report
          path: kodra/android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
