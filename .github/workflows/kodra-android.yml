name: Kodra Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "kodra/android/**"
      - ".github/workflows/kodra-android.yml"
      - "kodra/**"
      - "build/kodra/**"

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint + assembleDebug
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hello
        run: echo "hello from kodra android workflow"
