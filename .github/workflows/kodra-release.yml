name: Kodra Release APK

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.0)"
        required: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KODRA_KEYSTORE_BASE64: ${{ secrets.KODRA_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: kodra/android

      - name: Set up Java 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: "8.9"

      - name: Restore keystore
        if: env.KODRA_KEYSTORE_BASE64 != ''
        run: |
          echo "$KODRA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kodra-release.jks"
          echo "KODRA_KEYSTORE=$RUNNER_TEMP/kodra-release.jks" >> "$GITHUB_ENV"

      - name: Warn when unsigned
        if: env.KODRA_KEYSTORE_BASE64 == ''
        run: echo "::warning::No KODRA_KEYSTORE_BASE64 secret; the release APK will be unsigned and not installable."

      - name: Assemble release APK
        working-directory: kodra/android
        env:
          KODRA_KEYSTORE_PASSWORD: ${{ secrets.KODRA_KEYSTORE_PASSWORD }}
          KODRA_KEY_ALIAS: ${{ secrets.KODRA_KEY_ALIAS }}
          KODRA_KEY_PASSWORD: ${{ secrets.KODRA_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kodra-release-apk
          path: kodra/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: kodra/android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
